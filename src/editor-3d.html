<title>Blueprint Sketch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: visor 3D grande a la izquierda, panel con pestañas a la derecha (abajo en móvil). Estética única oscura. */
:root{
  --bg:#141516; --panel:#1c1e20; --panel2:#232628; --ink:#ece8e1; --muted:#9b968d; --line:#34373a; --accent:#d08a3c;
  --display:"Archivo",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px}
.wrap{max-width:1320px;margin:0 auto;display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 340px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:end;justify-content:space-between}
h1{font-weight:800;font-size:1.45rem;margin:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;color:var(--ink)}
.seg button,.btn{font-size:.82rem;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:3px;cursor:pointer}
.seg button[aria-pressed="true"],.btn.on{background:var(--accent);border-color:var(--accent);color:#1a1209}
.btn:hover,.seg button:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{min-width:0;display:grid;gap:8px}
#view{position:relative;width:100%;aspect-ratio:16/10;max-height:80vh;min-height:320px;background:#0d0e0f;border:1px solid var(--line);border-radius:4px;overflow:hidden;touch-action:none}
#view canvas{display:block;width:100%;height:100%}
.hint{position:absolute;left:10px;top:10px;font-size:.72rem;color:var(--muted);background:rgba(0,0,0,.5);padding:4px 8px;border-radius:3px;pointer-events:none;max-width:70%}
#selbar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:rgba(20,21,22,.92);border:1px solid var(--line);border-radius:4px;padding:8px}
#selbar b{font-size:.85rem;margin-right:4px}
#selbar .pos{font-family:var(--mono);font-size:.75rem;color:var(--muted);margin-right:auto}
#selbar .btn{padding:5px 9px}
aside{background:var(--panel);border:1px solid var(--line);border-radius:4px;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:1;background:none;border:0;padding:10px 6px;font-size:.8rem;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{padding:14px;display:grid;gap:14px;max-height:72vh;overflow:auto}
.pane h3{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lib button{display:flex;justify-content:space-between;gap:6px;align-items:center;text-align:left;font-size:.8rem;padding:7px 9px;border:1px solid var(--line);background:var(--panel2);border-radius:3px;cursor:pointer}
.lib button small{font-family:var(--mono);color:var(--muted);font-size:.68rem}
.style{display:grid;gap:6px}
.style button{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border:1px solid var(--line);background:var(--panel2);border-radius:3px;cursor:pointer;font-size:.85rem}
.style button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.dots{display:flex;gap:3px}.dots i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.15)}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw button{width:26px;height:26px;border-radius:3px;border:1px solid rgba(255,255,255,.2);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.sw input[type=color]{width:34px;height:28px;border:1px solid var(--line);background:none;padding:0;cursor:pointer}
select{width:100%;font:inherit;font-size:.85rem;padding:7px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:3px}
.floors{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.floors button{padding:0;border:1px solid var(--line);border-radius:3px;background:var(--panel2);cursor:pointer;overflow:hidden;text-align:left}
.floors button img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.floors button span{display:block;font-size:.7rem;padding:4px 5px;line-height:1.2}
.floors button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.ctl{display:grid;gap:4px}
.ctl label{font-size:.75rem;color:var(--muted);display:flex;justify-content:space-between}
.ctl output{font-family:var(--mono);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.items{display:grid;gap:4px}
.items button{display:flex;justify-content:space-between;font-size:.8rem;padding:6px 8px;border:1px solid var(--line);background:none;border-radius:3px;cursor:pointer;text-align:left}
.items button.on{border-color:var(--accent)}
.note{font-size:.78rem;color:var(--muted);margin:0;line-height:1.45}
.foot{display:flex;flex-wrap:wrap;gap:6px}
#toast{font-size:.78rem;color:var(--accent)}
</style>

<div class="wrap">
  <header>
    <h1>Blueprint Sketch</h1>
    <div class="seg" id="cam">
      <button data-v="planta" aria-pressed="true">Planta 3D</button>
      <button data-v="entrada" aria-pressed="false">Cuarto desde la entrada</button>
      <button data-v="cuarto2" aria-pressed="false">Cuarto hacia el pasillo</button>
      <button data-v="pasillo" aria-pressed="false">Pasillo</button>
      <button data-v="bano" aria-pressed="false">Baño</button>
    </div>
  </header>

  <div class="stage">
    <div id="view">
      <div class="hint" id="hint">Arrastra un mueble para moverlo · arrastra el fondo para girar · rueda o pellizco para acercar</div>
      <div id="selbar" hidden></div>
    </div>
    <p class="note">Medidas reales del plano: cuarto 4×4 m, baño 2,80×4 m y pasillo 1,20×4 m. Los muebles se mueven en pasos de 5 cm. El diseño se guarda en este navegador.</p>
  </div>

  <aside>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-t="estilo" aria-selected="true">Estilo</button>
      <button role="tab" data-t="muebles" aria-selected="false">Muebles</button>
      <button role="tab" data-t="paredes" aria-selected="false">Paredes</button>
      <button role="tab" data-t="pisos" aria-selected="false">Pisos</button>
      <button role="tab" data-t="ventana" aria-selected="false">Ventana</button>
    </div>
    <div class="pane" id="p-estilo"></div>
    <div class="pane" id="p-muebles" hidden></div>
    <div class="pane" id="p-paredes" hidden></div>
    <div class="pane" id="p-pisos" hidden></div>
    <div class="pane" id="p-ventana" hidden></div>
    <div class="pane" style="border-top:1px solid var(--line);max-height:none">
      <div class="foot"><button class="btn" id="copy">Copiar diseño</button><button class="btn" id="reset">Restablecer</button><span id="toast"></span></div>
      <div id="resetConfirm" hidden class="foot"><span class="note">¿Borrar todos los cambios?</span><button class="btn on" id="resetYes">Sí, restablecer</button><button class="btn" id="resetNo">Cancelar</button></div>
    </div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const H=2.4, XW=2.8, SNAP=.05;
const $=id=>document.getElementById(id);
const f2=n=>(+n).toFixed(2).replace('.',',');

/* ================= texturas ================= */
function rnd(s){return()=>{s=(s*16807)%2147483647;return s/2147483647}}
function mkCanvas(n,draw){const c=document.createElement('canvas');c.width=c.height=n;draw(c.getContext('2d'),n);return c;}
function noise(g,n,base,amp,seed){const R=rnd(seed||7);g.fillStyle=base;g.fillRect(0,0,n,n);for(let i=0;i<n*n/6;i++){const v=(R()-.5)*amp;g.fillStyle=v>0?`rgba(255,255,255,${v})`:`rgba(0,0,0,${-v})`;g.fillRect(R()*n,R()*n,2,2);}}
function veins(g,n,seed,rgba,cnt){const R=rnd(seed);for(let k=0;k<cnt;k++){g.strokeStyle=rgba(R);g.lineWidth=.6+R()*2.4;g.beginPath();let x=R()*n,y=R()*n;g.moveTo(x,y);
  for(let s=0;s<6;s++){const x2=x+(R()-.3)*260,y2=y+(R()-.5)*260;g.bezierCurveTo(x+(R()-.5)*120,y+(R()-.5)*120,x2+(R()-.5)*120,y2+(R()-.5)*120,x2,y2);x=x2;y=y2;}g.stroke();}}
function grout(g,n,cols,rows,stagger,col,w){g.strokeStyle=col;g.lineWidth=w;const cw=n/cols,rh=n/rows;
  for(let r=0;r<=rows;r++){g.beginPath();g.moveTo(0,r*rh);g.lineTo(n,r*rh);g.stroke();}
  for(let r=0;r<rows;r++)for(let c=0;c<=cols;c++){const x=c*cw+(stagger&&r%2?cw/2:0);g.beginPath();g.moveTo(x,r*rh);g.lineTo(x,(r+1)*rh);g.stroke();}}
// pisos: cada lienzo = 1,2 × 1,2 m
const FLOORS={
  marmol_blanco:{n:'Mármol blanco 60×120 (actual)',c:mkCanvas(1024,(g,n)=>{noise(g,n,'#eeedeb',.06,3);veins(g,n,11,R=>`rgba(${110+R()*40|0},${112+R()*40|0},${118+R()*40|0},${.25+R()*.45})`,14);grout(g,n,2,1,false,'rgba(150,150,150,.6)',2);}),rough:.18},
  marmol_negro:{n:'Mármol negro 60×120',c:mkCanvas(1024,(g,n)=>{noise(g,n,'#1d1d20',.05,4);veins(g,n,17,R=>`rgba(${200+R()*40|0},${200+R()*40|0},${200+R()*40|0},${.2+R()*.5})`,12);grout(g,n,2,1,false,'rgba(70,70,70,.8)',2);}),rough:.15},
  cemento:{n:'Tipo cemento 60×60',c:mkCanvas(1024,(g,n)=>{noise(g,n,'#8e8c88',.12,5);const R=rnd(8);for(let i=0;i<50;i++){g.fillStyle=`rgba(0,0,0,${R()*.05})`;g.beginPath();g.arc(R()*n,R()*n,20+R()*90,0,7);g.fill();}grout(g,n,2,2,false,'rgba(60,60,60,.7)',3);}),rough:.7},
  madera:{n:'Tipo madera 20×120',c:mkCanvas(1024,(g,n)=>{const R=rnd(19);const pw=n/6;for(let i=0;i<6;i++){const l=40+R()*12;g.fillStyle=`hsl(28,40%,${l}%)`;g.fillRect(i*pw,0,pw,n);
    for(let k=0;k<30;k++){g.strokeStyle=`rgba(60,35,20,${.1+R()*.2})`;g.lineWidth=1+R()*2;const x=i*pw+R()*pw;g.beginPath();g.moveTo(x,0);g.bezierCurveTo(x+(R()-.5)*14,n/3,x+(R()-.5)*14,2*n/3,x,n);g.stroke();}}
    g.strokeStyle='rgba(40,25,15,.8)';g.lineWidth=3;for(let i=0;i<=6;i++){g.beginPath();g.moveTo(i*pw,0);g.lineTo(i*pw,n);g.stroke();const y=(i%3)*n/3+n/6;g.beginPath();g.moveTo(i*pw,y);g.lineTo((i+1)*pw,y);g.stroke();}}),rough:.55},
  terrazo:{n:'Terrazo 60×60',c:mkCanvas(1024,(g,n)=>{noise(g,n,'#dcd7cf',.05,6);const R=rnd(23);const cols=['#8a8378','#b65e3c','#5f6e66','#3d3b38','#c9b48f','#f7f5f0'];
    for(let i=0;i<2600;i++){g.fillStyle=cols[R()*cols.length|0];g.beginPath();const x=R()*n,y=R()*n,r=1.5+R()*6;g.moveTo(x+r,y);for(let a=1;a<6;a++)g.lineTo(x+Math.cos(a)*r*(.6+R()*.6),y+Math.sin(a)*r*(.6+R()*.6));g.fill();}grout(g,n,2,2,false,'rgba(120,115,108,.6)',2);}),rough:.35},
  gris_claro:{n:'Gris claro 60×60',c:mkCanvas(1024,(g,n)=>{noise(g,n,'#c8c7c4',.06,9);grout(g,n,2,2,false,'rgba(120,120,120,.6)',2);}),rough:.4}
};
// acabados de pared (se tiñen con color)
const TEX={
  micro:{c:mkCanvas(512,(g,n)=>{noise(g,n,'#dddbd7',.10,5);const R=rnd(9);for(let i=0;i<40;i++){g.fillStyle=`rgba(0,0,0,${R()*.02})`;g.beginPath();g.arc(R()*n,R()*n,30+R()*90,0,7);g.fill();}}),s:1.5},
  ladrillo:{c:mkCanvas(1024,(g,n)=>{g.fillStyle='#5a4c44';g.fillRect(0,0,n,n);const R=rnd(21),bh=n/16,bw=n/4;
    for(let r=0;r<16;r++){const off=r%2?bw/2:0;for(let c=-1;c<5;c++){g.fillStyle=`hsl(${12+R()*10},${40+R()*15}%,${30+R()*12}%)`;g.fillRect(c*bw+off+4,r*bh+4,bw-8,bh-8);
      for(let i=0;i<40;i++){g.fillStyle=`rgba(0,0,0,${R()*.15})`;g.fillRect(c*bw+off+4+R()*(bw-10),r*bh+4+R()*(bh-10),3,3);}}}}),s:1.0},
  grande:{c:mkCanvas(512,(g,n)=>{noise(g,n,'#e6e6e6',.05,4);grout(g,n,2,1,false,'#9a9a9a',3);}),s:1.2},
  metro:{c:mkCanvas(512,(g,n)=>{const R=rnd(31);g.fillStyle='#a8a8a8';g.fillRect(0,0,n,n);const w=n/2,h=n/8;
    for(let r=0;r<8;r++)for(let c=-1;c<3;c++){const l=88+R()*8;g.fillStyle=`hsl(0,0%,${l}%)`;g.fillRect(c*w+(r%2?w/2:0)+3,r*h+3,w-6,h-6);}}),s:.6},
  madera:{c:mkCanvas(512,(g,n)=>{const R=rnd(41);const sw=n/6;for(let i=0;i<6;i++){g.fillStyle=`hsl(30,25%,${78+R()*8}%)`;g.fillRect(i*sw,0,sw,n);
    for(let k=0;k<14;k++){g.strokeStyle=`rgba(90,60,30,${.08+R()*.15})`;g.lineWidth=1+R()*2;const x=i*sw+6+R()*(sw-12);g.beginPath();g.moveTo(x,0);g.lineTo(x+(R()-.5)*6,n);g.stroke();}
    g.fillStyle='rgba(20,12,6,.85)';g.fillRect(i*sw,0,5,n);}}),s:.6}
};
const woodCanvas=mkCanvas(512,(g,n)=>{g.fillStyle='#c79d70';g.fillRect(0,0,n,n);const R=rnd(13);for(let i=0;i<120;i++){g.strokeStyle=`rgba(${80+R()*40|0},${50+R()*20|0},25,${.12+R()*.25})`;g.lineWidth=1+R()*3;const y=R()*n;g.beginPath();g.moveTo(0,y);g.bezierCurveTo(n/3,y+(R()-.5)*20,2*n/3,y+(R()-.5)*20,n,y+(R()-.5)*10);g.stroke();}});
function texFrom(canvas,rx,ry){const t=new THREE.CanvasTexture(canvas);t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=8;return t;}

/* ================= materiales ================= */
const METALS={negro:{n:'Negro mate',c:0x17181a,m:.6,r:.5},cromo:{n:'Cromo',c:0xd2d6d9,m:1,r:.18},laton:{n:'Latón',c:0xb38a45,m:1,r:.32}};
const WOODS={clara:{n:'Clara',c:0xffffff},roble:{n:'Roble',c:0xd2a77c},nogal:{n:'Nogal',c:0x80604a}};
const M={
  struct:new THREE.MeshStandardMaterial({color:0x3a3c3f,roughness:1}),
  ceil:new THREE.MeshStandardMaterial({color:0xe9e7e2,roughness:1}),
  metal:new THREE.MeshStandardMaterial({color:0x17181a,roughness:.5,metalness:.6}),
  wood:new THREE.MeshStandardMaterial({map:texFrom(woodCanvas,1,1),roughness:.6}),
  carcass:new THREE.MeshStandardMaterial({color:0x2b2c2e,roughness:.7}),
  white:new THREE.MeshStandardMaterial({color:0xf2f1ee,roughness:.22}),
  linen:new THREE.MeshStandardMaterial({color:0xdcd8d0,roughness:1}),
  duvet:new THREE.MeshStandardMaterial({color:0x3b3e42,roughness:1}),
  fabric:new THREE.MeshStandardMaterial({color:0x5b5550,roughness:1}),
  rug:new THREE.MeshStandardMaterial({color:0x4a4640,roughness:1}),
  green:new THREE.MeshStandardMaterial({color:0x3f6b3a,roughness:.9}),
  pot:new THREE.MeshStandardMaterial({color:0x2d2b29,roughness:.8}),
  screen:new THREE.MeshStandardMaterial({color:0x0a0a0b,roughness:.15,metalness:.3}),
  glass:new THREE.MeshStandardMaterial({color:0xcfe3e6,roughness:.05,metalness:.1,transparent:true,opacity:.2,depthWrite:false}),
  mirror:new THREE.MeshStandardMaterial({color:0xa4adb2,roughness:.06,metalness:.95}),
  tray:new THREE.MeshStandardMaterial({color:0x3d4044,roughness:.5}),
  bulb:new THREE.MeshBasicMaterial({color:0xffd59a}),
  sky:new THREE.MeshBasicMaterial({color:0xcfe0ec}),
  book:[0x7a3b2e,0x2f4a5c,0xc9b48f,0x3d3b38].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.9})),
  hl:new THREE.MeshBasicMaterial({color:0xd08a3c,transparent:true,opacity:.35,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2})
};
const lin=c=>new THREE.Color(c).convertSRGBToLinear();
for(const m of Object.values(M).flat())if(m.color&&!m.map)m.color.convertSRGBToLinear();
const finishCache=new Map();
function finishMat(spec,len,h){
  const t=spec.t, key=[t,spec.p||'',spec.c||'',t==='madera'?state.wood:'',len.toFixed(1),h.toFixed(1)].join('|');
  if(finishCache.has(key))return finishCache.get(key);
  let m;
  if(t==='pintura') m=new THREE.MeshStandardMaterial({color:lin(spec.c),roughness:.92});
  else if(t==='micro') m=new THREE.MeshStandardMaterial({map:texFrom(TEX.micro.c,len/TEX.micro.s,h/TEX.micro.s),color:lin(spec.c||'#c9c6c0'),roughness:.85});
  else if(t==='ladrillo') m=new THREE.MeshStandardMaterial({map:texFrom(TEX.ladrillo.c,len/TEX.ladrillo.s,h/TEX.ladrillo.s),roughness:.95});
  else if(t==='enchape'){const T=TEX[spec.p||'grande'];m=new THREE.MeshStandardMaterial({map:texFrom(T.c,len/T.s,h/T.s),color:lin(spec.c),roughness:.28});}
  else if(t==='madera') m=new THREE.MeshStandardMaterial({map:texFrom(TEX.madera.c,len/TEX.madera.s,h/TEX.madera.s),color:lin(WOODS[state.wood].c),roughness:.6});
  finishCache.set(key,m);return m;
}
const floorCache=new Map();
function floorMat(k,sx,sz){const key=k+sx+'x'+sz;if(floorCache.has(key))return floorCache.get(key);
  const F=FLOORS[k];const m=new THREE.MeshStandardMaterial({map:texFrom(F.c,sx/1.2,sz/1.2),roughness:F.rough});floorCache.set(key,m);return m;}

/* ================= estado ================= */
const WALLS=[
  {id:'c_izq',n:'Cuarto · pared de la ventana',z:'cuarto'},{id:'c_der',n:'Cuarto · pared de la cama',z:'cuarto'},
  {id:'c_ent',n:'Cuarto · pared de la entrada',z:'cuarto'},{id:'c_bano',n:'Cuarto · pared hacia el baño',z:'cuarto'},
  {id:'p_nuevo',n:'Pasillo · muro nuevo',z:'pasillo'},{id:'p_resto',n:'Pasillo · demás paredes',z:'pasillo'},
  {id:'b_fondo',n:'Baño · pared del fondo (ducha)',z:'bano'},{id:'b_izq',n:'Baño · pared izquierda',z:'bano'},
  {id:'b_nuevo',n:'Baño · muro nuevo',z:'bano'},{id:'b_cuarto',n:'Baño · pared hacia el cuarto',z:'bano'}
];
const STYLES={
  ind_concreto:{n:'Industrial concreto',metal:'negro',wood:'roble',dots:['#bdbab4','#2e3033','#4a4e52','#17181a'],
    all:{t:'micro',c:'#bdbab4'},w:{c_der:{t:'pintura',c:'#2e3033'},b_fondo:{t:'enchape',p:'grande',c:'#55595e'},b_izq:{t:'enchape',p:'grande',c:'#55595e'}}},
  ind_ladrillo:{n:'Industrial ladrillo',metal:'negro',wood:'nogal',dots:['#d9d5ce','#8a4b33','#25322c','#17181a'],
    all:{t:'pintura',c:'#d9d5ce'},w:{c_der:{t:'ladrillo'},p_nuevo:{t:'ladrillo'},b_fondo:{t:'enchape',p:'metro',c:'#2e3d36'},b_izq:{t:'enchape',p:'metro',c:'#2e3d36'}}},
  moderno:{n:'Moderno minimal',metal:'cromo',wood:'clara',dots:['#f1f0ec','#cfcac1','#efeeea','#d2d6d9'],

  const it=cur&&itemOf(cur),bar=$('selbar');

  const o=objOf(cur);helper.setFromObject(o);helper.visible=true;bar.hidden=false;
  const L=LIB[it.t],elev=L.elev!=null;
  bar.innerHTML=`<b>${L.n}</b><span class="pos">x ${f2(it.x)} · z ${f2(it.z)}${elev?` · altura ${f2(it.y??L.elev)}`:''} m</span>
    <button class="btn" data-a="l" aria-label="Mover a la izquierda">←</button><button class="btn" data-a="u" aria-label="Mover hacia el fondo">↑</button><button class="btn" data-a="d" aria-label="Mover hacia adelante">↓</button><button class="btn" data-a="r" aria-label="Mover a la derecha">→</button>
    <button class="btn" data-a="rot">Girar 90°</button>${elev?'<button class="btn" data-a="up">Subir</button><button class="btn" data-a="down">Bajar</button>':''}
    <button class="btn" data-a="dup">Duplicar</button><button class="btn" data-a="del">Eliminar</button>`;
  renderList();need=true;
}
function act(a){const it=itemOf(cur);if(!it)return;const L=LIB[it.t];
  if(a==='del'){state.items=state.items.filter(i=>i!==it);cur=null;commit(true);return;}
  if(a==='dup'){const n={...it,id:'i'+(++state.n),x:it.x+.3,z:it.z+.3};clampIt(n);state.items.push(n);cur=n.id;commit(true);return;}
  if(a==='rot'){it.r=(it.r+1)%4;clampIt(it);commit(true);return;}
  if(a==='up'||a==='down'){it.y=Math.min(2.1,Math.max(0,(it.y??L.elev)+(a==='up'?.05:-.05)));commit(true);return;}
  const dx={l:-SNAP,r:SNAP}[a]||0,dz={u:-SNAP,d:SNAP}[a]||0;it.x+=dx;it.z+=dz;clampIt(it);const o=objOf(it.id);o.position.set(it.x,0,it.z);commit(false);}
$('selbar').addEventListener('click',e=>{const b=e.target.closest('button');if(b)act(b.dataset.a);});
function commit(rebuild){save();if(rebuild)buildItems();else refreshSel();}
addEventListener('keydown',e=>{if(!cur||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  const k={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',Delete:'del',Backspace:'del',r:'rot',R:'rot'}[e.key];if(k){e.preventDefault();act(k);}});

/* ================= arrastre ================= */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),hit=new THREE.Vector3();
let drag=null,down=null;
function setNdc(e){const r=renderer.domElement.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);}
view.addEventListener('pointerdown',e=>{
  if(e.target!==renderer.domElement)return;
  setNdc(e);down={x:e.clientX,y:e.clientY};
  const hits=ray.intersectObjects(itemsG.children,true);
  if(hits.length){const id=hits[0].object.userData.itemId;cur=id;refreshSel();
    ray.ray.intersectPlane(plane,hit);const it=itemOf(id);drag={id,ox:it.x-hit.x,oz:it.z-hit.z,moved:false};controls.enabled=false;renderer.domElement.setPointerCapture(e.pointerId);}
},true);
view.addEventListener('pointermove',e=>{if(!drag)return;setNdc(e);if(!ray.ray.intersectPlane(plane,hit))return;
  const it=itemOf(drag.id);it.x=hit.x+drag.ox;it.z=hit.z+drag.oz;clampIt(it);objOf(it.id).position.set(it.x,0,it.z);drag.moved=true;helper.setFromObject(objOf(it.id));
  $('selbar').querySelector('.pos').textContent=`x ${f2(it.x)} · z ${f2(it.z)} m`;need=true;});
view.addEventListener('pointerup',e=>{
  if(drag){if(drag.moved)save();drag=null;controls.enabled=true;refreshSel();return;}
  if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>5||e.target!==renderer.domElement)return;
  setNdc(e);const fh=ray.intersectObjects(structG.children,false).find(h=>h.object.userData.face);
  if(fh&&tab==='paredes'){selWall=fh.object.userData.face;renderWalls();buildStruct();}
  if(cur){cur=null;refreshSel();}
});

/* ================= cámaras ================= */
const CAMS={entrada:{p:[3.15,1.55,7.75],t:[1.4,1.1,4.6]},cuarto2:{p:[.45,1.55,7.6],t:[3.2,1.1,4.1]},pasillo:{p:[3.45,1.5,3.85],t:[3.2,1.1,0]},
  bano:{p:[2.55,1.6,3.75],t:[.6,1.0,.8]},planta:{p:[2,12.5,7.6],t:[2,0,4.1]}};
function topHide(){structG.traverse(o=>{if(o.userData.top)o.visible=camKey!=='planta'});}
function setCam(k){camKey=k;const c=CAMS[k];camera.position.set(...c.p);controls.target.set(...c.t);if(ceil)ceil.visible=k!=='planta';if(sky)sky.visible=k!=='planta';topHide();camera.fov=k==='planta'?42:72;camera.updateProjectionMatrix();controls.update();need=true;}
function seg(el,fn){el.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===t));fn(t.dataset.v);});}
seg($('cam'),setCam);

/* ================= paneles ================= */
const hex=c=>'#'+new THREE.Color(c).getHexString();
function applyMetalWood(){const m=METALS[state.metal];M.metal.color.copy(lin(m.c));M.metal.metalness=m.m;M.metal.roughness=m.r;M.wood.color.copy(lin(WOODS[state.wood].c));need=true;}
function renderStyle(){
  $('p-estilo').innerHTML=`<div><h3>Estilos</h3><div class="style" id="styles">${Object.entries(STYLES).map(([k,s])=>`<button data-v="${k}" aria-pressed="${state.style===k}">${s.n}<span class="dots">${s.dots.map(c=>`<i style="background:${c}"></i>`).join('')}</span></button>`).join('')}</div>
    <p class="note" style="margin-top:6px">Un estilo cambia paredes, metales y madera. Los muebles y los pisos se mantienen.</p></div>
    <div><h3>Metales</h3><div class="seg" id="metals">${Object.entries(METALS).map(([k,m])=>`<button data-v="${k}" aria-pressed="${state.metal===k}">${m.n}</button>`).join('')}</div></div>
    <div><h3>Madera</h3><div class="seg" id="woods">${Object.entries(WOODS).map(([k,m])=>`<button data-v="${k}" aria-pressed="${state.wood===k}">${m.n}</button>`).join('')}</div></div>`;
  seg($('styles'),k=>{styleWalls(state,k);applyMetalWood();save();buildStruct();renderStyle();});
  seg($('metals'),k=>{state.metal=k;applyMetalWood();save();});
  seg($('woods'),k=>{state.wood=k;applyMetalWood();save();buildStruct();});
}
function renderList(){const el=$('itemlist');if(!el)return;
  el.innerHTML=state.items.length?state.items.map(it=>`<button data-id="${it.id}" class="${it.id===cur?'on':''}"><span>${LIB[it.t].n}</span><small style="font-family:var(--mono);color:var(--muted)">${f2(it.x)}, ${f2(it.z)}</small></button>`).join(''):'<p class="note">Todavía no hay muebles. Agrega uno de la biblioteca.</p>';}
function renderMuebles(){
  $('p-muebles').innerHTML=LIBGROUPS.map(([g,ks])=>`<div><h3>${g}</h3><div class="grid2 lib">${ks.map(k=>`<button data-k="${k}"><span>${LIB[k].n}</span><small>${f2(LIB[k].w)}×${f2(LIB[k].d)}</small></button>`).join('')}</div></div>`).join('')+
    `<div><h3>En el plano</h3><div class="items" id="itemlist"></div></div><p class="note">Toca un mueble para agregarlo; aparece en su zona y queda seleccionado para que lo arrastres. Con un mueble seleccionado también sirven las flechas del teclado, R para girar y Supr para eliminar.</p>`;
  $('p-muebles').querySelector('.lib')&&$('p-muebles').querySelectorAll('.lib').forEach(l=>l.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k,L=LIB[k],[x,z]=SPAWN[L.zone];
    const it={id:'i'+(++state.n),t:k,x,z,r:0};if(L.elev!=null)it.y=L.elev;clampIt(it);state.items.push(it);cur=it.id;save();buildItems();}));
  $('itemlist').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cur=b.dataset.id;refreshSel();});
  renderList();
}
const SWATCH=['#f4f3ef','#e8dece','#d9d5ce','#bdbab4','#8f8c86','#55595e','#2e3033','#1b1c1e','#a7b7a9','#5e6f62','#2e3d36','#d0a27a','#9b5b3c','#3d4d63'];
const FINISH=[['pintura','Pintura'],['micro','Microcemento'],['ladrillo','Ladrillo'],['enchape-grande','Enchape 60×120'],['enchape-metro','Enchape metro'],['madera','Listones de madera']];
function renderWalls(){
  const s=state.walls[selWall],fk=s.t==='enchape'?'enchape-'+(s.p||'grande'):s.t,col=s.c||'#c9c6c0',zone=WALLS.find(w=>w.id===selWall).z;
  $('p-paredes').innerHTML=`<div><h3>Pared</h3><select id="wsel">${WALLS.map(w=>`<option value="${w.id}" ${w.id===selWall?'selected':''}>${w.n}</option>`).join('')}</select>
    <p class="note" style="margin-top:6px">También puedes tocar una pared en el visor para elegirla. La pared elegida se resalta en naranja.</p></div>
    <div><h3>Acabado</h3><div class="seg" id="fin">${FINISH.map(([k,n])=>`<button data-v="${k}" aria-pressed="${fk===k}">${n}</button>`).join('')}</div></div>
    <div ${['ladrillo','madera'].includes(s.t)?'hidden':''}><h3>Color</h3><div class="sw" id="sw">${SWATCH.map(c=>`<button data-c="${c}" style="background:${c}" aria-label="Color ${c}" aria-pressed="${col.toLowerCase()===c}"></button>`).join('')}
      <input type="color" id="wcol" value="${hex(col)}" aria-label="Color personalizado"></div></div>
    <div><h3>Copiar a otras paredes</h3><div class="foot"><button class="btn" data-z="${zone}" id="tozone">A toda la zona (${{cuarto:'cuarto',pasillo:'pasillo',bano:'baño'}[zone]})</button><button class="btn" id="toall">A todas</button></div></div>`;
  $('wsel').onchange=e=>{selWall=e.target.value;renderWalls();buildStruct();};
  seg($('fin'),v=>{const[t,p]=v.split('-');const n={t};if(p)n.p=p;if(!['ladrillo','madera'].includes(t))n.c=col;state.walls[selWall]=n;state.style='';save();renderWalls();buildStruct();});
  const setCol=c=>{if(['ladrillo','madera'].includes(state.walls[selWall].t))return;state.walls[selWall].c=c;state.style='';save();renderWalls();buildStruct();};
  $('sw').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setCol(b.dataset.c);});
  $('wcol').addEventListener('change',e=>setCol(e.target.value));
  $('tozone').onclick=()=>{for(const w of WALLS)if(w.z===zone)state.walls[w.id]={...state.walls[selWall]};save();buildStruct();};
  $('toall').onclick=()=>{for(const w of WALLS)state.walls[w.id]={...state.walls[selWall]};save();buildStruct();};
}
const thumbs={};for(const[k,F]of Object.entries(FLOORS)){const c=document.createElement('canvas');c.width=c.height=120;c.getContext('2d').drawImage(F.c,0,0,1024,1024,0,0,120,120);thumbs[k]=c.toDataURL();}
function renderPisos(){
  const grp=(zone,lbl)=>`<div><h3>${lbl}</h3><div class="floors" data-z="${zone}">${Object.entries(FLOORS).map(([k,F])=>`<button data-v="${k}" aria-pressed="${state.floor[zone]===k}"><img src="${thumbs[k]}" alt=""><span>${F.n}</span></button>`).join('')}</div></div>`;
  $('p-pisos').innerHTML=grp('main','Cuarto y pasillo')+grp('bano','Baño')+`<p class="note">Si cambias el baño a un acabado distinto, en obra se resuelve con una platina o un cambio de nivel en el vano de la puerta.</p>`;
  $('p-pisos').querySelectorAll('.floors').forEach(el=>seg(el,v=>{state.floor[el.dataset.z]=v;save();buildStruct();}));
}
function renderVentana(){
  const w=state.win;const room=w.pos+w.w<=4?'baño':'cuarto';
  const sl=(id,l,min,max,v)=>`<div class="ctl"><label for="${id}">${l}<output id="o_${id}">${f2(v)} m</output></label><input id="${id}" type="range" min="${min}" max="${max}" step="0.05" value="${v}"></div>`;
  $('p-ventana').innerHTML=`<p class="note">La ventana va en el muro exterior izquierdo, que recorre el baño y el cuarto. Ahora queda en el <b style="color:var(--ink)">${room}</b>.</p>
    ${sl('wpos','Posición desde la esquina del fondo',.1,7.9-w.w,w.pos)}${sl('ww','Ancho',.5,2.4,w.w)}${sl('wh','Alto',.4,1.6,w.h)}${sl('ws','Altura del antepecho',.3,1.6,w.sill)}
    <p class="note">En el baño conviene una ventana alta (antepecho de 1,50 m o más) por privacidad. La ventana no puede cruzar el muro entre baño y cuarto: se corre sola al lado más cercano.</p>`;
  const upd=()=>{w.pos=+$('wpos').value;w.w=+$('ww').value;w.h=+$('wh').value;w.sill=+$('ws').value;
    if(w.sill+w.h>H-.1)w.h=+(H-.1-w.sill).toFixed(2);w.pos=Math.min(w.pos,7.9-w.w);
    if(w.pos<4.075&&w.pos+w.w>3.925){w.pos=(w.pos+w.w/2<4)?3.9-w.w:4.1;w.pos=Math.max(.1,w.pos);}
    save();buildStruct();};
  for(const id of['wpos','ww','wh','ws'])$(id).addEventListener('change',()=>{upd();renderVentana();});
  for(const id of['wpos','ww','wh','ws'])$(id).addEventListener('input',e=>{$('o_'+id).textContent=f2(e.target.value)+' m';});
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;
  $('tabs').querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',x===b));for(const t of['estilo','muebles','paredes','pisos','ventana'])$('p-'+t).hidden=t!==tab;
  ({estilo:renderStyle,muebles:renderMuebles,paredes:renderWalls,pisos:renderPisos,ventana:renderVentana})[tab]();buildStruct();});

$('copy').onclick=async()=>{const txt=JSON.stringify(state);try{await navigator.clipboard.writeText(txt);$('toast').textContent='Diseño copiado. Pégamelo en el chat para seguir desde ahí.';}
  catch(e){$('toast').textContent='No se pudo copiar automáticamente.';}setTimeout(()=>$('toast').textContent='',4000);};
$('reset').onclick=()=>{$('resetConfirm').hidden=false;};
$('resetNo').onclick=()=>{$('resetConfirm').hidden=true;};
$('resetYes').onclick=()=>{state=defaultState();cur=null;save();applyMetalWood();buildStruct();buildItems();renderStyle();$('resetConfirm').hidden=true;
  $('tabs').querySelector('[data-t="estilo"]').click();};

/* ================= arranque ================= */
function resize(){const r=view.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();need=true;}
new ResizeObserver(resize).observe(view);
applyMetalWood();buildStruct();buildItems();renderStyle();setCam('planta');resize();
(function loop(){requestAnimationFrame(loop);if(controls.update())need=true;if(need){if(cur&&helper.visible){const o=objOf(cur);if(o)helper.setFromObject(o);}renderer.render(scene,camera);need=false;}})();
</script>
